<div class="card">

    <div class="card-header">

        <h3 class="card-title">
           <b>Manufacturer</b>
        </h3>

        <div class="card-tools">

            <button *ngIf="can('create')" class="btn btn-primary btn-sm" (click)="openCreateModal()">

                <i class="fas fa-plus"></i>
                New
            </button>

        </div>

    </div>

    <div class="card-body">

        <ul class="nav nav-pills mb-3">

            <li class="nav-item">
                <a class="nav-link" [class.active]="activeTab==='active'" (click)="changeTab('active')">
                    Active
                </a>
            </li>

            <li class="nav-item">
                <a class="nav-link" [class.active]="activeTab==='inactive'" (click)="changeTab('inactive')">
                    Inactive
                </a>
            </li>

        </ul>

        <div class="table-responsive">

            <table class="table table-bordered table-hover">

                <thead>

                    <tr>
                        <th>Name</th>
                        <th>Contact</th>
                        <th>Email</th>
                        <th>Country</th>
                        <th>Status</th>
                        <th width="150">
                            Actions
                        </th>
                    </tr>

                </thead>

                <tbody>

                    <tr *ngFor="
                        let row of
                        paginatedManufacturers">

                        <td>
                            {{row.manufacturer_name}}
                        </td>

                        <td>
                            {{row.contact_no}}
                        </td>

                        <td>
                            {{row.email}}
                        </td>

                        <td>
                            {{row.country}}
                        </td>

                        <td>

                            <span *ngIf="row.is_active" class="badge bg-success">
                                Active
                            </span>

                            <span *ngIf="!row.is_active" class="badge bg-danger">
                                Inactive
                            </span>

                        </td>

                        <td>

                            <button *ngIf="can('view')" class="btn btn-info btn-sm me-1" (click)="openViewModal(row)">
                                <i class="fas fa-eye"></i>
                            </button>

                            <button *ngIf="can('edit')" class="btn btn-warning btn-sm me-1"
                                (click)="openEditModal(row)">
                                <i class="fas fa-edit"></i>
                            </button>

                            <button *ngIf="can('delete')" class="btn btn-danger btn-sm" (click)="confirmDelete(row)">
                                <i class="fas fa-trash"></i>
                            </button>

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

<!-- Modal -->

<div class="modal fade" id="manufacturerModal">

    <div class="modal-dialog modal-lg">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title">

                    {{
                    isEditMode
                    ? 'Edit Manufacturer'
                    : 'Create Manufacturer'
                    }}

                </h5>

            </div>

            <div class="modal-body">

                <form [formGroup]="form">

                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label>Name</label>

                            <input class="form-control" formControlName="manufacturer_name">

                        </div>

                        <div class="col-md-6 mb-3">

                            <label>Contact No</label>

                            <input class="form-control" formControlName="contact_no">

                        </div>

                        <div class="col-md-6 mb-3">

                            <label>Email</label>

                            <input class="form-control" formControlName="email">

                        </div>

                        <div class="col-md-6 mb-3">

                            <label>Country</label>

                            <input class="form-control" formControlName="country">

                        </div>

                        <div class="col-md-12 mb-3">

                            <label>Website</label>

                            <input class="form-control" formControlName="website">

                        </div>

                        <div class="col-md-12 mb-3">

                            <label>Address</label>

                            <textarea rows="3" class="form-control" formControlName="address">
                            </textarea>

                        </div>

                        <div class="col-md-12">

                            <div class="form-check">

                                <input type="checkbox" class="form-check-input" formControlName="is_active">

                                <label class="form-check-label">
                                    Active
                                </label>

                            </div>

                        </div>

                    </div>

                </form>

            </div>

            <div class="modal-footer">

                <button *ngIf="!isViewMode" class="btn btn-primary" (click)="save()">

                    Save

                </button>

                <button class="btn btn-secondary" (click)="closeModal()">

                    Close

                </button>

            </div>

        </div>

    </div>

</div>
