<div class="card-body login-card-body" *ngIf="!resetPasswordStatus">
    <p class="login-box-msg text-center">You are one step away from your new password.</p>
    <form [formGroup]="resetPasswordForm" (ngSubmit)="resetPassword()">
        <div class="mb-3">
            <div class="input-group">
                <input [type]="showPassword ? 'text' : 'password'" class="form-control" formControlName="Password"
                    placeholder="Password"
                    [ngClass]="{'is-invalid': resetPasswordForm.get('Password')?.invalid && resetPasswordForm.get('Password')?.touched}" />

                <div class="input-group-text" (click)="togglePassword()" style="cursor:pointer;">
                    <span class="fas" [ngClass]="showPassword ? 'fa-eye-slash' : 'fa-eye'"></span>
                </div>
            </div>

            <div class="invalid-feedback d-block"
                *ngIf="resetPasswordForm.get('Password')?.hasError('required') && resetPasswordForm.get('Password')?.touched">
                Password is required
            </div>

            <div class="invalid-feedback d-block"
                *ngIf="resetPasswordForm.get('Password')?.hasError('minlength') && resetPasswordForm.get('Password')?.touched">
                Minimum 4 characters required
            </div>

            <div class="invalid-feedback d-block"
                *ngIf="resetPasswordForm.get('Password')?.hasError('maxlength') && resetPasswordForm.get('Password')?.touched">
                Maximum 8 characters allowed
            </div>
        </div>

        <div class="mb-3">
            <div class="input-group">
                <input [type]="showConfirmPassword ? 'text' : 'password'" class="form-control"
                    formControlName="ConfirmPassword" placeholder="Retype Password"
                    [ngClass]="{
                                    'is-invalid': (resetPasswordForm.get('ConfirmPassword')?.invalid && resetPasswordForm.get('ConfirmPassword')?.touched)
                                        || (resetPasswordForm.hasError('mismatch') && resetPasswordForm.get('ConfirmPassword')?.touched)}" />

                <div class="input-group-text" (click)="toggleConfirmPassword()" style="cursor:pointer;">
                    <span class="fas" [ngClass]="showConfirmPassword ? 'fa-eye-slash' : 'fa-eye'"></span>
                </div>
            </div>

            <div class="invalid-feedback d-block"
                *ngIf="resetPasswordForm.hasError('mismatch') && resetPasswordForm.get('ConfirmPassword')?.touched">
                Passwords do not match
            </div>
        </div>

        <button type="submit" class="btn btn-primary w-100">
            Change Password
        </button>
    </form>

    <div class="text-center mt-3">
        <a routerLink="/login">Login</a>
    </div>
</div>

<div class="card-body text-center" *ngIf="resetPasswordStatus">
    <div class="alert alert-success">
        <h5><i class="fas fa-check"></i> Success</h5>
        <p>Your password was changed successfully.</p>
    </div>

    <a routerLink="/login" class="btn btn-primary w-100">
        Login
    </a>
</div>
